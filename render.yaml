services:
  - type: web
    name: byte-exchange-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=backend
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: https://byte-nu.vercel.app
